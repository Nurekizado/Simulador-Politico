 if(Math.random()<1-Math.pow(1-mort(S.age),1/12)){S.dead=1;log(`💀 Você faleceu aos ${S.age} anos.`);return render()}
 Object.values(S.races).forEach(r=>{r.L=r.L.filter(x=>{if(!x.me&&Math.random()<1-Math.pow(1-mort(S.y-x.b),1/12)){log('💀 '+x.n+' faleceu aos '+(S.y-x.b)+' anos e saiu da disputa.');return false}return true})});
 if(elY()){poll();if(S.m==10)elect()}
 if(Math.random()<.08){const e=R([['Escândalo atinge seu partido nas redes',-3,0],['Sua fala viraliza positivamente',3,2000],['Crise econômica afeta a popularidade',-2,0]]);S.pop=cl(S.pop+e[1],0,100);S.fol+=e[2];log('📰 '+e[0]+'.')}
 if(!S.office&&S.pop>20&&Math.random()<.04&&!S.inv){S.inv=1;log('📩 Você recebeu um convite para ser Ministro!')}
 S.m++;S.ap=3;S.deb=0;if(S.m>12){S.m=1;S.y++;S.age++;log('🎂 Você completou '+S.age+' anos.');
  if(S.next&&S.next.y==S.y){const o=S.next.o;S.terms=(o==S.office&&OFF[o].ex)?S.terms+1:1;S.office=o;S.termEnd=S.y+OFF[o].yrs-1;S.app=55;S.mins={};log(`🎉 Você tomou posse como ${o}!`);S.next=null}
  else if(S.office&&S.y>S.termEnd){log(`Seu mandato de ${S.office} terminou.`);S.office=null;S.terms=0}
  mkAll()}render()}
function act(k){if(S.ap<1)return;S.ap--;const f=(1+S.pop/50)*cl(1.4-S.age/80,.6,1.3);
 if(k=='v'){S.fol+=rnd(200,1500)*f;S.pop+=.4;log('📱 Vídeo publicado: seguidores crescem.')}
 if(k=='c'){if(Math.random()<.5){S.fol+=rnd(3000,9000);S.pop+=2;log('🔥 Polêmica rendeu engajamento!')}else{S.pop=Math.max(0,S.pop-4);S.fol*=.95;log('🚫 Cancelamento! Popularidade caiu.')}}
 if(k=='l'){S.pop+=1;S.fol+=rnd(100,600);log('🎥 Live com eleitores.')}
 if(k=='b'){if(S.money<5e3){S.ap++;return alert('Sem dinheiro.')}S.money-=5e3;S.fol+=rnd(1500,4000);log('💸 Impulsionamento pago (R$ 5 mil).')}
 S.pop=cl(S.pop,0,100);render()}
function spend(v){const c=OFF[S.run];if(S.money<v)return alert('Dinheiro insuficiente.');S.money-=v;const g=6*Math.log10(1+v/(c.sc*mult(S.run)*1e4));S.hype+=g;log(`📢 Campanha: gastou ${brl(v)} (+${g.toFixed(1)} de força).`);render()}
function debate(){if(S.deb)return;S.deb=1;const sc=Math.random()*10+S.fol/6000+S.props.length*.5;if(sc>7){S.pop+=4;S.fol+=3000;log('🎤 Você foi bem no debate!')}else{S.pop=Math.max(0,S.pop-2);log('🎤 Debate fraco: perdeu pontos.')}render()}
function mk(){const a=$('#ar').value,ac=$('#ac').value,pu=$('#pu').value,co=$('#co').value;const m=1-Math.abs(ideo()-PUB[pu])/4.5;
 return{n:`${ac} ${a.toLowerCase()} — ${pu}`,c:COST[co][0],v:+((1+m*2)*COST[co][1]).toFixed(1),m}}
function prop(){const p=mk();S.props.push(p.n);const g=p.v/(1+S.props.length*.15)*.8*cred();S.pop=cl(S.pop+g,0,100);log(`📝 Proposta criada: ${p.n} (+${g.toFixed(1)} popularidade).`);render()}
function send(){const p=mk(),t=$('#ty').value,o=S.office;if(!o)return;if(t=='Programa'&&!EXE.includes(o))return alert('Só o Executivo cria programas.');
 if(t=='Mandatos'){S.pj.push({t,n:'Limite de mandatos',c:2,lim:+$('#li').value});log('📜 Projeto enviado: alterar limite de mandatos.')}
 else{S.pj.push({t,n:p.n,c:p.c,v:p.v});log(`📜 ${t} enviado(a): ${p.n}.`)}render()}
function rev(i){if(!S.office)return;const l=S.laws[i];S.pj.push({t:'Revogar',n:l.n,c:l.v>0?3:1});log('🗑️ Projeto de revogação enviado: '+l.n);render()}
function nom(m){const c={n:gname(),c:Math.round(rnd(2,10))};S.mins[m]=c;log(`🤝 ${c.n} nomeado(a) ministro(a) de ${m} (competência ${c.c}).`);render()}
function accept(){S.office='Ministro';S.termEnd=S.y+3;S.inv=0;S.app=55;log('Você assumiu como Ministro.');render()}
function chParty(){if(![3,4].includes(S.m))return alert('Janela partidária: só em Mar/Abr.');S.party=$('#np').value;S.pop=Math.max(0,S.pop-3);log('Você mudou para o '+S.party+' (-3 pop).');render()}
function newParty(){const s=$('#cs').value.trim().toUpperCase().slice(0,8),n=$('#cn').value.trim(),i=+$('#ci').value;if(!s||!n)return alert('Informe nome e sigla.');if(PT[s]!==undefined)return alert('Essa sigla já existe.');if(S.money<5e4)return alert('Criar um partido custa R$ 50 mil.');
 S.money-=5e4;PT[s]=i;S.party=s;S.pop=Math.max(0,S.pop-1);S.fol+=2000;log(`🏛️ Você fundou o partido ${s} (${n}).`);render()}
const brl=v=>'R$ '+Math.round(v).toLocaleString('pt-BR');
const opt=(a,s)=>a.map(x=>`<option${x==s?' selected':''}>${x}</option>`).join('');
function render(){const A=$('#app');
 if(!S){A.innerHTML=`<h1>🇧🇷 Simulador Político Brasileiro</h1><p class="mu">Simulação fictícia. Nomes de políticos reais são usados apenas como personagens (partidos e idades aproximados).</p><div class="c"><h2>Seu personagem</h2><input id="nm" placeholder="Seu nome"><select id="pt">${opt(Object.keys(PT))}</select><select id="uf" onchange="cyOpts()">${opt('AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' '),'SP')}</select><select id="cy">${opt(cities('SP'))}</select><label class="mu">Idade (18–85): jovens são menos levados a sério; idosos têm menos tempo de vida</label><input id="ag" type="number" min="18" max="85" value="35"><label class="mu">Dinheiro inicial (R$)</label><select id="mo"><option value="10000">R$ 10 mil</option><option value="100000" selected>R$ 100 mil</option><option value="1000000">R$ 1 milhão</option><option value="10000000">R$ 10 milhões</option></select><button class="p" onclick="start()" style="width:100%;margin-top:8px">Começar em 2026</button></div>`;return}
 if(S.dead){A.innerHTML=`<h1>💀 Fim de jogo</h1><div class="c"><p>${S.name} faleceu em ${MN[S.m-1]}/${S.y}, aos ${S.age} anos${S.office?', ainda exercendo o cargo de '+S.office:''}.</p><p class="mu">Leis em vigor: ${S.laws.length} · Propostas: ${S.props.length} · Seguidores: ${Math.round(S.fol)}</p><button class="p" onclick="S=null;render()">Nova partida</button></div>`;return}
 const k=elY(),ex=S.office&&EXE.includes(S.office);let h=`<h1>🇧🇷 ${MN[S.m-1]}/${S.y} — ${S.office||'Cidadão'}</h1>
 <div class="g"><div><b>${brl(S.money)}</b><span>Dinheiro</span></div><div><b>${S.app.toFixed(0)}%</b><span>Aprovação</span></div><div><b>${S.pop.toFixed(1)}</b><span>Popularidade</span></div><div><b>${Math.round(S.fol).toLocaleString('pt-BR')}</b><span>Seguidores</span></div><div><b>${S.fiscal.toFixed(0)}</b><span>Dívida fiscal</span></div><div><b>${S.party}</b><span>${S.city}/${S.uf} · ${S.age} anos</span></div></div>
 <div class="tabs" style="margin:10px 0">${[['p','Painel'],['c','Criar'],['l','Leis'],['t','Partido'],['y','Cidades']].map(x=>`<button class="${tab==x[0]?'on':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`;
 if(tab=='p'){
  if(S.inv)h+=`<div class="c">📩 Convite para ser Ministro. <button class="p" onclick="accept()">Aceitar</button></div>`;
  if(k){const r=getRace(S.vo,S.vu,S.vc);h+=`<div class="c"><h2>${k=='m'?'Eleição municipal':'Eleição geral'} ${S.y} — intenção de voto</h2><div class="tabs">${Object.keys(OFF).filter(o=>OFF[o].k==k).map(o=>`<button class="${S.vo==o?'on':''}" onclick="S.vo='${o}';render()">${o}${S.run==o?' ⭐':''}</button>`).join('')}</div>${S.vo=='Presidente'?'<p class="mu">Pesquisa nacional (Brasil).</p>':`<div class="row"><select style="flex:1" onchange="S.vu=this.value;S.vc=cities(S.vu)[0];render()">${opt(UFS,S.vu)}</select>${OFF[S.vo].k=='m'?`<select style="flex:1" onchange="S.vc=this.value;render()">${opt(cities(S.vu),S.vc)}</select>`:''}<button onclick="S.vu=S.uf;S.vc=S.city;render()">📍 Meu local</button></div>`}`;
   if(r){const sr=shares(r),mx=sr[0].v,c=OFF[r.o];sr.slice(0,10).forEach((x,i)=>h+=`<div class="bar ${x.me?'me':''} ${c.seats&&i<c.seats?'w':''}"><span>${x.n}${x.r?' ★':''} <small class="mu">${x.p}</small></span><i><u style="width:${x.v/mx*100}%"></u></i><em>${x.v.toFixed(1)}%</em></div>`);
    h+=`<p class="mu">Indecisos/brancos: 12%. ${c.seats?`Faixa dourada = ${c.seats} vagas.`:'Maioria absoluta evita 2º turno.'} ★ = político real.</p>`;
    if(S.run){h+=`<div class="row">${[1e4,5e4,25e4,1e6].map(v=>`<button onclick="spend(${v})">📢 ${brl(v)}</button>`).join('')}<button onclick="debate()" ${S.m<7||S.deb?'disabled':''}>🎤 Debate (Jul–Out)</button></div><p class="mu">Custo típico p/ ${S.run}: ${brl(OFF[S.run].sc*mult(S.run)*1e4)}. Eleição em Outubro.</p>`}
    else if(S.m<=7){const os=Object.keys(OFF).filter(o=>OFF[o].k==k);h+=`<select id="ro">${opt(os)}</select><button class="p" onclick="run()">Candidatar-se (até Jul)</button><p class="mu">Você não precisa se candidatar e só pode concorrer em ${S.city}/${S.uf}. Idade mínima: Vereador 18, Deputados/Prefeito 21, Governador 30, Senador/Presidente 35. Limite executivo: ${S.limit} mandatos.</p>`}
   }h+=`</div>`}
  h+=`<div class="c"><h2>Redes sociais (${S.ap} ações no mês)</h2><div class="row"><button onclick="act('v')">🎬 Vídeo</button><button onclick="act('l')">🎥 Live</button><button onclick="act('c')">🔥 Polêmica</button><button onclick="act('b')">💸 Impulsionar R$5k</button></div></div>`;
  if(S.office=='Presidente')h+=`<div class="c"><h2>Ministérios</h2>${MIN.map(m=>`<div class="bar"><span style="width:160px">${m}: ${S.mins[m]?S.mins[m].n+' ('+S.mins[m].c+')':'vago'}</span><button onclick="nom('${m}')">Nomear</button></div>`).join('')}</div>`;
  h+=`<div class="c log"><h2>Diário</h2>${S.log.slice(0,14).map(x=>`<p>${x}</p>`).join('')}</div>`}
 if(tab=='c'){h+=`<div class="c"><h2>Montar proposta / projeto</h2><select id="ty"><option>Lei</option><option>Programa</option><option>Mandatos</option></select><select id="ar">${opt(AREA)}</select><select id="ac">${opt(ACT)}</select><select id="pu">${opt(Object.keys(PUB))}</select><select id="co">${opt(Object.keys(COST))}</select><label class="mu">Se tipo = Mandatos: novo limite</label><select id="li"><option>1</option><option selected>2</option><option>3</option><option value="99">Ilimitado</option></select><div class="row"><button onclick="prop()">📝 Proposta de campanha</button><button class="p" onclick="send()" ${S.office?'':'disabled'}>📜 Enviar ao plenário</button></div><p class="mu">Propostas aumentam popularidade conforme a afinidade do público com seu partido. Projetos precisam de cargo e são votados ao avançar o mês.</p></div><div class="c"><h2>Propostas (${S.props.length})</h2>${S.props.map(x=>`<p class="mu">• ${x}</p>`).join('')||'<p class="mu">Nenhuma ainda.</p>'}</div>`}
 if(tab=='l')h+=`<div class="c"><h2>Leis em vigor</h2>${S.laws.map((l,i)=>`<div class="bar"><span style="flex:1;width:auto;white-space:normal">${l.n}</span><button onclick="rev(${i})" ${S.office?'':'disabled'}>Revogar</button></div>`).join('')}<p class="mu">Pendentes: ${S.pj.map(p=>p.t+': '+p.n).join('; ')||'nenhum'}</p></div>`;
 if(tab=='t')h+=`<div class="c"><h2>Partidos</h2>${Object.keys(PT).map(p=>`<div class="bar ${p==S.party?'me':''}"><span>${p}</span><i><u style="width:${(PT[p]+2.2)/4.4*100}%"></u></i><em>${PT[p]>0?'Dir':PT[p]<0?'Esq':'Centro'}</em></div>`).join('')}<select id="np">${opt(Object.keys(PT),S.party)}</select><button onclick="chParty()">Trocar de partido (Mar/Abr)</button></div><div class="c"><h2>Fundar novo partido (R$ 50 mil)</h2><input id="cn" placeholder="Nome do partido"><input id="cs" placeholder="Sigla (ex.: PBR)" maxlength="8"><select id="ci"><option value="-2">Esquerda</option><option value="-1">Centro-esquerda</option><option value="0" selected>Centro</option><option value="1">Centro-direita</option><option value="2">Direita</option></select><button class="p" onclick="newParty()">🏛️ Fundar partido</button><p class="mu">Você entra no partido na hora e ganha seguidores. A ideologia define a afinidade das propostas com cada público.</p></div>`;
 if(tab=='y')h+=`<div class="c"><h2>Cidades de ${S.uf} (${cities(S.uf).length})</h2>${cities(S.uf).map((c,i)=>`<div class="bar ${c==S.city?'me':''}"><span style="flex:1;width:auto;white-space:normal">${c}${i==0?' (capital)':''} <small class="mu">prefeito: ${mayor(c)}</small></span><em style="width:auto">${'★'.repeat(tier(S.uf,c))}</em></div>`).join('')}<p class="mu">Estados mais importantes têm mais cidades. Cidades maiores (★) custam mais na campanha municipal. Você concorre em ${S.city}.</p></div>`;
 A.innerHTML=h+`<div class="nx"><button class="p" onclick="tick()">Avançar mês ▶</button></div>`}
render();
</script></body></html>
